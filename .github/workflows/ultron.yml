name: ULTRON-EXPERIMENT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar memória
        uses: actions/cache@v4
        with:
          path: data
          key: ultron-memory-${{ github.run_id }}
          restore-keys: |
            ultron-memory-

      - name: Executar ciclo
        run: python run.py
